services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - 8080
    ports:
      # Portas de mídia WebRTC (VoIP) necessárias para o fluxo de áudio RTP
      - "${KALLIA_UDP_PORT:-50000}:${KALLIA_UDP_PORT:-50000}/udp"
      - "${KALLIA_UDP_PORT:-50000}:${KALLIA_UDP_PORT:-50000}/tcp"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@kallia.app}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-KalliaAdmin2026!}
      - REDIS_URL=redis://redis:6379
      - KALLIA_PUBLIC_IP=${KALLIA_PUBLIC_IP:-auto}
      - KALLIA_UDP_PORT=${KALLIA_UDP_PORT:-50000}
      - KALLIA_MAX_CALLS=${KALLIA_MAX_CALLS:-8}
      - KALLIA_JWT_SECRET=${KALLIA_JWT_SECRET:-kallia_jwt_secret_key_prod_2026_secure}
      - KALLIA_ENCRYPTION_KEY=${KALLIA_ENCRYPTION_KEY:-kallia_master_encryption_key_2026_secure}
      - KALLIA_LOG_LEVEL=${KALLIA_LOG_LEVEL:-info}
      - KALLIA_CORS_ORIGINS=${KALLIA_CORS_ORIGINS:-*}
      - KALLIA_STORAGE_DIR=/app/storage
      - KALLIA_PG_URL=postgres://${POSTGRES_USER:-kallia}:${POSTGRES_PASSWORD:-kallia_secure_2026}@postgres:5432/${POSTGRES_DB:-kallia}?sslmode=disable
    volumes:
      - ./storage:/app/storage
    depends_on:
      - pocketbase
      - redis
      - postgres

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    expose:
      - 8090
    environment:
      - PB_ENCRYPTION_KEY=${POCKETBASE_ENCRYPTION_KEY:-}
      - PB_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@kallia.app}
      - PB_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-KalliaAdmin2026!}
    volumes:
      - ./storage/pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
      - ./pb_hooks:/pb_hooks
      - ./pb_migrations:/pocketbase/pb_migrations
      - ./pb_hooks:/pocketbase/pb_hooks
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - 6379
    volumes:
      - ./storage/redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    expose:
      - 5432
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-kallia}
      - POSTGRES_USER=${POSTGRES_USER:-kallia}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kallia_secure_2026}
    volumes:
      - ./storage/pg_data:/var/lib/postgresql/data
